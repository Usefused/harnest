[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "harnest"
version = "1.8.0"
description = "Filesystem-first Python authoring SDK for ADK and LangGraph agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = ["Typing :: Typed"]
dependencies = [
  "anyio>=4.5,<5",
  "croniter>=6,<7",
  "a2a-sdk[http-server]>=1.1.2,<2",
  # Reviewed security-patched release. Change deliberately when updating the lock.
  "litellm==1.106.6",
  "packaging>=24,<27",
  "fastapi>=0.115",
  "httpx[socks]>=0.28,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.31",
  "PyYAML>=6,<7",
  "opentelemetry-api>=1.40,<=1.42.1",
  "opentelemetry-sdk>=1.40,<=1.42.1",
  "opentelemetry-exporter-otlp-proto-http>=1.40,<=1.42.1",
  "opentelemetry-instrumentation-fastapi>=0.61b0,<0.64",
  "opentelemetry-instrumentation-logging>=0.61b0,<0.64",
]

[project.optional-dependencies]
# Release staging pins this to the compiled Studio assistant framework.
studio = ["google-adk>=2.8,<3", "ruff>=0.14,<1"]
quality = [
  "fakeredis[lua]>=2.34,<3",
  "build>=1,<2",
  "hatchling>=1.25,<2",
  "pyright>=1.1.414,<2",
  "radon>=6,<7",
  "ruff>=0.14,<1",
  "setuptools>=82,<85",
]
postgres = ["asyncpg>=0.30,<1"]
redis = ["redis>=6,<8"]
adk = [
  "google-adk>=2.8,<3",
  "asyncpg>=0.30,<1",
  "redis>=6,<8",
]
adk-mcp = ["google-adk[mcp]>=2.8,<3", "mcp>=1.26,<2"]
langgraph = [
  "langgraph>=1.2,<2",
  "langchain>=1.3,<2",
  "langchain-litellm>=0.7,<1",
  "asyncpg>=0.30,<1",
  "redis>=6,<8",
]
langgraph-mcp = ["langchain-mcp-adapters>=0.3,<1", "mcp>=1.26,<2"]
openapi = ["fastmcp>=2.14.5,<3"]
test = ["pytest>=8,<9"]
# ADK's eval extra pulls in Vertex's optional local model adapters, which cap
# LiteLLM below the security fix. Harnest uses the hosted Vertex scoring client.
eval = [
  "google-adk>=2.8,<3",
  "google-cloud-aiplatform>=2.7,<3",
  "google-cloud-texttospeech>=2.37",
  "gepa>=0.1",
  "jinja2>=3.1.4,<4",
  "nltk!=3.10.1",
  "openpyxl>=3.1.5,<4",
  "pandas>=2.2.3",
  "rouge-score>=0.1.2",
  "tabulate>=0.9",
  "xlrd>=2,<3",
  "pytest>=8,<9",
]
all = [
  "fastmcp>=2.14.5,<3",
  "harnest[eval,adk-mcp]",
  "langgraph>=1.2,<2",
  "langchain>=1.3,<2",
  "langchain-litellm>=0.7,<1",
  "langchain-mcp-adapters>=0.3,<1",
  "asyncpg>=0.30,<1",
  "pytest>=8,<9",
  "redis>=6,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harnest", "src/harnest_postgres", "src/harnest_redis"]
exclude = ["src/harnest/_playground/**", "src/harnest/_studio/**", "src/harnest/studio_*.py"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Correctness-only for now (unused imports/vars, undefined names, etc.), mirroring
# this repo's complexity gate: a narrow, high-signal bar rather than a full style
# ruleset. Broader style rules (line length, import sorting, ...) can be layered
# on later as a deliberate follow-up, not bundled in here.
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# Declaration files executed by `harnest.cli` with `define_orchestrator` / `AgentSource`
# injected into their globals (see src/harnest/cli.py) — not undefined names at runtime.
"**/orchestrator.py" = ["F821"]

[tool.pytest.ini_options]
pythonpath = ["src", "packages/harnest-fused/src", "packages/harnest-threadify/src"]
testpaths = ["tests/python"]
