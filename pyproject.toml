[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "harnest"
version = "0.1.14"
description = "Filesystem-first Python authoring SDK for ADK and LangGraph agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "litellm>=1.84,<2",
  "packaging>=24,<27",
  "pytest>=8,<9",
  "fastapi>=0.115",
  "uvicorn>=0.31",
  "PyYAML>=6,<7",
  "opentelemetry-api>=1.40,<=1.42.1",
  "opentelemetry-sdk>=1.40,<=1.42.1",
  "opentelemetry-exporter-otlp-proto-http>=1.40,<=1.42.1",
  "opentelemetry-instrumentation-fastapi>=0.61b0,<0.64",
  "opentelemetry-instrumentation-logging>=0.61b0,<0.64",
]

[project.optional-dependencies]
quality = ["radon>=6,<7"]
adk = ["google-adk[eval,mcp]>=2.8,<3"]
langgraph = [
  "langgraph>=1.2,<2",
  "langchain>=1.3,<2",
  "langchain-litellm>=0.7,<1",
  "langchain-mcp-adapters>=0.3,<1",
]
all = [
  "google-adk[eval,mcp]>=2.8,<3",
  "langgraph>=1.2,<2",
  "langchain>=1.3,<2",
  "langchain-litellm>=0.7,<1",
  "langchain-mcp-adapters>=0.3,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harnest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/python"]
