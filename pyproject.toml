[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "harnest"
version = "0.21.3"
description = "Filesystem-first Python authoring SDK for ADK and LangGraph agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = ["Typing :: Typed"]
dependencies = [
  "anyio>=4.5,<5",
  "croniter>=6,<7",
  "a2a-sdk[http-server]>=1.1.2,<2",
  "litellm>=1.84,<2",
  "packaging>=24,<27",
  "fastapi>=0.115",
  "httpx[socks]>=0.28,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.31",
  "PyYAML>=6,<7",
  "tomli>=2,<3; python_version < '3.11'",
  "opentelemetry-api>=1.40,<=1.42.1",
  "opentelemetry-sdk>=1.40,<=1.42.1",
  "opentelemetry-exporter-otlp-proto-http>=1.40,<=1.42.1",
  "opentelemetry-instrumentation-fastapi>=0.61b0,<0.64",
  "opentelemetry-instrumentation-logging>=0.61b0,<0.64",
]

[project.optional-dependencies]
quality = [
  "build>=1,<2",
  "hatchling>=1.25,<2",
  "radon>=6,<7",
  "ruff>=0.14,<1",
  "setuptools>=82,<85",
]
postgres = ["asyncpg>=0.30,<1"]
redis = ["redis>=6,<8"]
adk = [
  "google-adk>=2.8,<3",
  "asyncpg>=0.30,<1",
  "redis>=6,<8",
]
adk-mcp = ["google-adk[mcp]>=2.8,<3"]
langgraph = [
  "langgraph>=1.2,<2",
  "langchain>=1.3,<2",
  "langchain-litellm>=0.7,<1",
  "asyncpg>=0.30,<1",
  "redis>=6,<8",
]
langgraph-mcp = ["langchain-mcp-adapters>=0.3,<1"]
openapi = ["fastmcp>=2.14.5,<3"]
test = ["pytest>=8,<9"]
eval = ["google-adk[eval]>=2.8,<3", "pytest>=8,<9"]
all = [
  "fastmcp>=2.14.5,<3",
  "google-adk[eval,mcp]>=2.8,<3",
  "langgraph>=1.2,<2",
  "langchain>=1.3,<2",
  "langchain-litellm>=0.7,<1",
  "langchain-mcp-adapters>=0.3,<1",
  "asyncpg>=0.30,<1",
  "pytest>=8,<9",
  "redis>=6,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harnest", "src/harnest_postgres", "src/harnest_redis"]
exclude = ["src/harnest/_playground/**"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Correctness-only for now (unused imports/vars, undefined names, etc.), mirroring
# this repo's complexity gate: a narrow, high-signal bar rather than a full style
# ruleset. Broader style rules (line length, import sorting, ...) can be layered
# on later as a deliberate follow-up, not bundled in here.
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# Declaration files executed by `harnest.cli` with `define_orchestrator` / `AgentSource`
# injected into their globals (see src/harnest/cli.py) — not undefined names at runtime.
"**/orchestrator.py" = ["F821"]

[tool.pytest.ini_options]
pythonpath = ["src", "packages/harnest-fused/src"]
testpaths = ["tests/python"]
