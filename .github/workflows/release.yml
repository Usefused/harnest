name: Build and release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python build and runtime dependencies
        run: python -m pip install --upgrade build ".[all]"

      - name: Run test suite
        run: make test

      - name: Validate installer shell
        run: sh -n install.sh

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Resolve release version
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version=$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          tag="v${version}"
          publish=false
          create_tag=false

          if ! git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            publish=true
            create_tag=true
          elif [ "$(git rev-list -n 1 "${tag}")" = "${GITHUB_SHA}" ] && ! gh release view "${tag}" >/dev/null 2>&1; then
            publish=true
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          echo "create_tag=${create_tag}" >> "${GITHUB_OUTPUT}"

      - name: Create release tag
        if: steps.release.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --annotate "${TAG}" --message "Harnest ${{ steps.release.outputs.version }}"
          git push origin "${TAG}"

      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report existing release
        if: steps.release.outputs.publish != 'true'
        run: echo "${{ steps.release.outputs.tag }} is already released; bump project.version to publish another release."
