name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing Release Please tag to package
        required: true
        type: string
      release_sha:
        description: Optional expected commit for the tag
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag_name }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
      EXPECTED_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python build and runtime dependencies
        run: python -m pip install --upgrade build

      - name: Verify release source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag ${RELEASE_TAG} is not a supported semantic version." >&2
            exit 1
          fi

          tagged_sha=$(git rev-list -n 1 "${RELEASE_TAG}")
          if [ "$(git rev-parse HEAD)" != "${tagged_sha}" ]; then
            echo "Checkout does not match ${RELEASE_TAG}." >&2
            exit 1
          fi

          if [ -n "${EXPECTED_SHA}" ] && [ "${tagged_sha}" != "${EXPECTED_SHA}" ]; then
            echo "${RELEASE_TAG} points to ${tagged_sha}, not ${EXPECTED_SHA}." >&2
            exit 1
          fi

          project_version=$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          source_version=$(sed -n 's/^_SOURCE_VERSION = "\([^"]*\)".*/\1/p' src/harnest/compatibility.py)
          tag_version=${RELEASE_TAG#v}
          if [ "${project_version}" != "${tag_version}" ] || [ "${source_version}" != "${tag_version}" ]; then
            echo "${RELEASE_TAG}, pyproject.toml (${project_version}), and compatibility.py (${source_version}) must match." >&2
            exit 1
          fi

          # Packaging only enriches the release that owns this source commit;
          # it must never create an unreviewed release independently.
          gh release view "${RELEASE_TAG}" >/dev/null

      - name: Attach release artifacts
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
