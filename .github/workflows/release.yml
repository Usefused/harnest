name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  goreleaser:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python build and runtime dependencies
        run: python -m pip install --upgrade build

      - name: Verify release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag=$(git tag --points-at "${RELEASE_SHA}" --list 'v[0-9]*' | sort -V | tail -n 1)
          if [ -z "${tag}" ]; then
            echo "No release tag points to validated commit ${RELEASE_SHA}." >&2
            exit 1
          fi

          tagged_sha=$(git rev-list -n 1 "${tag}")
          if [ "${tagged_sha}" != "${RELEASE_SHA}" ]; then
            echo "${tag} points to ${tagged_sha}, not the validated commit ${RELEASE_SHA}." >&2
            exit 1
          fi

          publish=true
          if gh release view "${tag}" >/dev/null 2>&1; then
            publish=false
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report existing release
        if: steps.release.outputs.publish != 'true'
        run: echo "${{ steps.release.outputs.tag }} is already published; leaving it unchanged."
