name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade build ".[all,quality]"

      - name: Run quality gates
        # setup-python owns `python`; distro-specific python3.x executables may
        # point at a different environment without the dependencies above.
        run: make quality PYTHON=python

      - name: Validate installer shell
        run: sh -n install.sh

  release-tag:
    name: Tag release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Create version tag
        shell: bash
        run: |
          version=$(python -c 'import pathlib, sys; toml = __import__("tomllib" if sys.version_info >= (3, 11) else "tomli"); print(toml.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          if [[ ! "${version}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "project.version must be a numeric major.minor.patch release baseline." >&2
            exit 1
          fi
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          baseline_patch=${BASH_REMATCH[3]}

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          # Concurrent validated commits may initially select the same patch.
          # Refetching and retrying lets the later commit advance without manual edits.
          for attempt in 1 2 3; do
            git fetch --tags origin
            existing_tag=$(git tag --points-at "${GITHUB_SHA}" --list 'v[0-9]*' | sort -V | tail -n 1)
            if [ -n "${existing_tag}" ]; then
              echo "${existing_tag} already points to ${GITHUB_SHA}; leaving it unchanged."
              exit 0
            fi

            patch=${baseline_patch}
            tag="v${major}.${minor}.${patch}"
            while git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; do
              patch=$((patch + 1))
              tag="v${major}.${minor}.${patch}"
            done

            git tag --annotate "${tag}" --message "Harnest ${tag#v}"
            if git push origin "refs/tags/${tag}"; then
              exit 0
            fi
            git tag --delete "${tag}"
          done

          echo "Unable to allocate a release tag after three attempts." >&2
          exit 1
