name: CI

on:
  pull_request:
    paths-ignore:
      - "official-extensions/**"
  push:
    branches:
      - "**"
    paths-ignore:
      - "official-extensions/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: harnest
          POSTGRES_PASSWORD: harnest
          POSTGRES_DB: harnest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harnest -d harnest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      HARNEST_TEST_POSTGRES_DSN: postgresql://harnest:harnest@127.0.0.1:5432/harnest
      HARNEST_TEST_POSTGRES_URL: postgresql://harnest:harnest@127.0.0.1:5432/harnest
      HARNEST_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade build ".[all,quality]" -c requirements/frameworks.txt

      - name: Run quality gates
        # setup-python owns `python`; distro-specific python3.x executables may
        # point at a different environment without the dependencies above.
        run: make quality PYTHON=python

      - name: Validate installer shell
        run: sh -n install.sh
