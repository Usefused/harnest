name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade build ".[all,quality]"

      - name: Run quality gates
        # setup-python owns `python`; distro-specific python3.x executables may
        # point at a different environment without the dependencies above.
        run: make quality PYTHON=python

      - name: Validate installer shell
        run: sh -n install.sh
