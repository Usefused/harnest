name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR updates own branch validation; a second push run would repeat every matrix.
# Include the source repository so identically named fork branches stay isolated.
concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select validation checks
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.changes.outputs.core }}
      extensions: ${{ steps.changes.outputs.extensions }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select checks from changed files
        id: changes
        run: python3 scripts/ci_changes.py

  quality:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: harnest
          POSTGRES_PASSWORD: harnest
          POSTGRES_DB: harnest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harnest -d harnest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      HARNEST_TEST_POSTGRES_DSN: postgresql://harnest:harnest@127.0.0.1:5432/harnest
      HARNEST_TEST_POSTGRES_URL: postgresql://harnest:harnest@127.0.0.1:5432/harnest
      HARNEST_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade build ".[all,quality]" -c requirements/frameworks.txt

      - name: Set up Node.js for Studio type checks
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run quality gates
        # setup-python owns `python`; distro-specific python3.x executables may
        # point at a different environment without the dependencies above.
        run: make quality PYTHON=python

      - name: Validate installer shell
        run: sh -n install.sh

  studio-release:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    name: Native release smoke tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pin the native arm64 runner; macos-latest repeatedly failed to allocate capacity.
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install compiler and build dependencies
        run: python -m pip install ".[adk,quality]" -c requirements/frameworks.txt
      - name: Test Studio frontend
        shell: bash
        run: node --test studio/tests/*.test.mjs
      - name: Test executable storage and native process behavior
        run: go test ./internal/agentpack ./cmd/harnest-agent
      - name: Test compiler executable packaging
        run: go test ./cmd/harnest -run "Test(ProjectPackInit|CompileSelection|CompileManifest|RuntimeReport|NativeExecutable|WindowsConsole|WindowsNative|ExecutableOptions|SharedRuntime|RuntimePack|RuntimeBuild|PortableConsole)"
      - name: Build release-equivalent CLI with bundled Studio
        shell: bash
        run: |
          version=$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          python scripts/prepare_agent_launchers.py
          python scripts/prepare_uv_assets.py --target "$(go env GOOS)-$(go env GOARCH)"
          python scripts/build_runtime_wheel.py --version "$version" --outdir internal/runtimewheel/assets --no-isolation
          go build -tags harnest_release -ldflags "-X main.version=$version" -o .cache/studio-release/harnest.exe ./cmd/harnest
      - name: Test Windows installer, Python discovery, and upgrade moves
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          go test ./cmd/harnest -run 'TestPython(ResolutionPrecedence|LocationsFollowHostLayout)$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/python -p test_harnest_extensions.py -k upgrade_moves_lifecycle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\test_windows_installer.ps1 -Cli .cache/studio-release/harnest.exe
      - name: Launch bundled Studio outside the checkout
        run: python scripts/smoke_studio_release.py --cli .cache/studio-release/harnest.exe
      - name: Build and run attached and embedded agents outside the checkout
        run: python scripts/smoke_agent_executable.py --cli .cache/studio-release/harnest.exe

  framework-compatibility:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/framework-compatibility.yml

  extensions:
    needs: changes
    if: needs.changes.outputs.extensions == 'true'
    uses: ./.github/workflows/validate-extensions.yml

  prepare-release:
    # Skipped extension checks are normal for core-only changes. Explicit success
    # requirements prevent failed, skipped, or superseded core checks releasing.
    needs: [quality, studio-release, framework-compatibility, extensions]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.quality.result == 'success' && needs.studio-release.result == 'success' &&
      needs.framework-compatibility.result == 'success' &&
      (needs.extensions.result == 'success' || needs.extensions.result == 'skipped')
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/release-please.yml
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
