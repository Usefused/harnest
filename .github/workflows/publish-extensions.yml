name: Publish Official Extensions

on:
  push:
    tags:
      - "harnest-extension-docker-v*"
      - "harnest-extension-hatchet-v*"
      - "harnest-extension-rag-v*"
  workflow_dispatch:
    inputs:
      extension:
        description: Official extension to publish from main
        required: true
        type: choice
        options:
          - docker
          - hatchet
          - rag

permissions:
  contents: read

concurrency:
  group: publish-official-extensions-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  # Branch validation is replaceable; immutable tag publishing must finish.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    uses: ./.github/workflows/validate-extensions.yml
    with:
      extension: ${{ inputs.extension || '' }}

  publish-docker:
    name: Publish Docker extension
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.extension == 'docker') ||
      startsWith(github.ref, 'refs/tags/harnest-extension-docker-v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Restore verified wheel
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # releases/v5
        with:
          name: harnest-extension-docker-wheel
          path: dist

      - name: Publish extension to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          # Manual releases and later tags can refer to the same immutable wheel.
          skip-existing: true

  publish-hatchet:
    name: Publish Hatchet extension
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.extension == 'hatchet') ||
      startsWith(github.ref, 'refs/tags/harnest-extension-hatchet-v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Restore verified wheel
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # releases/v5
        with:
          name: harnest-extension-hatchet-wheel
          path: dist

      - name: Publish extension to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          # Manual releases and later tags can refer to the same immutable wheel.
          skip-existing: true

  publish-rag:
    name: Publish RAG extension
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.extension == 'rag') ||
      startsWith(github.ref, 'refs/tags/harnest-extension-rag-v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Restore verified wheel
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # releases/v5
        with:
          name: harnest-extension-rag-wheel
          path: dist

      - name: Publish extension to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          # Manual releases and later tags can refer to the same immutable wheel.
          skip-existing: true
