name: Publish Official Extensions

on:
  pull_request:
    paths:
      - "official-extensions/docker/**"
      - ".github/workflows/publish-extensions.yml"
  push:
    branches:
      - "**"
    tags:
      - "harnest-extension-docker-v*"
    paths:
      - "official-extensions/docker/**"
      - ".github/workflows/publish-extensions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-extension-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Docker extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify release source
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "Manual Docker extension publishing must run from main." >&2
              exit 1
            fi
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#harnest-extension-docker-v}"
          else
            tag_version=""
          fi

          project="official-extensions/docker"
          project_version=$(python3 -c 'import pathlib, sys, tomllib; print(tomllib.loads((pathlib.Path(sys.argv[1]) / "pyproject.toml").read_text())["project"]["version"])' "${project}")
          manifest_version=$(sed -n 's/^  version: \([^ ]*\)$/\1/p' "${project}/extension.yaml")
          if [[ "${project_version}" != "${manifest_version}" ]]; then
            echo "Docker project and manifest versions do not match." >&2
            exit 1
          fi
          if [[ -n "${tag_version}" && "${tag_version}" != "${project_version}" ]]; then
            echo "Tag version ${tag_version} does not match Docker ${project_version}." >&2
            exit 1
          fi

      - name: Install build frontend
        run: python -m pip install --upgrade "build>=1.3,<2"

      - name: Build extension wheel
        run: python -m build --wheel --outdir dist official-extensions/docker

      - name: Preserve verified wheel
        uses: actions/upload-artifact@v4
        with:
          name: harnest-extension-docker-wheel
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish Docker extension
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/harnest-extension-docker-v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Restore verified wheel
        uses: actions/download-artifact@v5
        with:
          name: harnest-extension-docker-wheel
          path: dist

      - name: Publish extension to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
