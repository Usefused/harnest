name: Prepare Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Require release automation token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        shell: bash
        run: |
          if [ -z "${RELEASE_PLEASE_TOKEN}" ]; then
            echo "Add the RELEASE_PLEASE_TOKEN repository secret before preparing releases." >&2
            exit 1
          fi

      - name: Propose or create release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # The user token lets both release PR validation and the published
          # release event start their independent workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check out release proposal
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          fetch-depth: 0

      - name: Mark authored changelog notes with the proposed release
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          RELEASE_BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        shell: bash
        run: |
          python3 scripts/finalize_release_changelog.py
          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi

          # This hidden maintenance commit keeps authored notes inside the
          # release proposal without feeding a second user-facing release note.
          git config user.name "release-please[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: finalize release changelog"
          git push origin "HEAD:${RELEASE_BRANCH}"
