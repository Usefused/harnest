[build-system]
requires = ["setuptools>=82,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "harnest-extension-docker"
version = "0.4.2"
description = "Official Docker sandbox provider extension for Harnest"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Fused" },
]
dependencies = [
  "docker>=7.1,<8",
  "harnest>=1.0.0,<2",
]

[project.urls]
Documentation = "https://usefused.com/docs/harnest/build/extensions/official/docker"
Repository = "https://github.com/Usefused/harnest"

[project.entry-points."harnest.extensions"]
docker = "harnest_extension_docker.extension:extension"

[tool.setuptools]
packages = ["harnest_extension_docker", "harnest_extension_docker.lib"]
package-dir = { harnest_extension_docker = ".", "harnest_extension_docker.lib" = "lib" }

[tool.setuptools.package-data]
harnest_extension_docker = ["extension.yaml", "README.md"]
