[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "harnest-postgres"
version = "0.1.0"
description = "PostgreSQL persistence for Harnest sessions, durable tasks and cron"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["harnest>=0.18.0,<1", "asyncpg>=0.30,<1"]

[project.urls]
Documentation = "https://docs.usefused.com/harnest"
Source = "https://github.com/Usefused/harnest"

[tool.hatch.build.targets.wheel]
packages = ["src/harnest_postgres"]
