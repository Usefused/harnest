apiVersion: harnest.dev/v1alpha1
kind: Agent
metadata:
  name: mcp-agent
  displayName: Mcp Agent
spec:
  enabled: true
  entrypoint: agent:root_agent
  framework:
    name: adk
    mode: managed
  interfaces:
    cli: true
  runtime:
    version: "3.12"
    dependencyFile: pyproject.toml
  resources:
    cpu: "1"
    memory: 1Gi
    ephemeralStorage: 1Gi
    timeoutSeconds: 300
    maxConcurrentRequests: 8
  scaling:
    minReplicas: 0
    maxReplicas: 1
  # Set OPENAI_MODEL and OPENAI_BASE_URL in your environment before running.
  environment:
    HARNEST_MCP_URL: http://127.0.0.1:28081/mcp/29824641-fa66-4588-9488-aecf7a017556
    OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: NO_CONTENT
    ADK_CAPTURE_MESSAGE_CONTENT_IN_SPANS: "false"
