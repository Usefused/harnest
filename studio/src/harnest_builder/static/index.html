<!doctype html>
<html lang="en">
<head>
  <meta name="editor-style-nonce" content="__EDITOR_STYLE_NONCE__">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harnest Studio</title>
  <link rel="stylesheet" href="/assets/host.css">
  <link rel="stylesheet" href="/assets/selects.css">
  <script defer src="/assets/selects.js"></script>
  <script type="module" src="/assets/host.js"></script>
</head>
<body>
  <div id="studio-root"></div>
  <section id="studio-recovery" aria-label="Studio recovery">
    <strong>Harnest Studio · by Fused</strong>
    <p id="studio-boot-status" role="status">Loading your Studio packs…</p>
    <form id="studio-connect" hidden>
      <label for="studio-launch-url">Launch URL from your terminal</label>
      <input id="studio-launch-url" type="password" autocomplete="off" required>
      <button type="submit">Connect</button>
    </form>
    <a id="studio-safe" href="/?safe-ui=1">Restore default UI</a>
  </section>
</body>
</html>
