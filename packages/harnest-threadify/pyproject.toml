[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "harnest-threadify"
version = "0.1.0"
description = "Optional Threadify workflow and telemetry integration for Harnest"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Fused" }]
dependencies = ["harnest>=1.0.0,<2", "threadify-sdk>=0.4.0,<0.5"]

[project.urls]
Documentation = "https://usefused.com/docs/harnest/runtime/telemetry/threadify"
Repository = "https://github.com/Usefused/harnest"

[tool.hatch.build.targets.wheel]
packages = ["src/harnest_threadify"]
