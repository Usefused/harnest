[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "harnest-fused"
version = "0.1.0"
description = "Compose OpenAPI services into one Fused MCP client for Harnest"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Fused" }]
dependencies = ["harnest>=1.0.0,<2"]

[project.urls]
Documentation = "https://usefused.com/docs/harnest/build/fused-mcp"
Repository = "https://github.com/Usefused/harnest"

[tool.hatch.build.targets.wheel]
packages = ["src/harnest_fused"]
