[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "acme-harnest-example"
version = "0.1.0"
description = "Example company CLI with a bundled Harnest Studio pack"
requires-python = ">=3.11"
dependencies = ["harnest==1.5.0"]

[project.optional-dependencies]
studio = ["harnest-agent-builder==0.1.0"]

[project.scripts]
acme = "acme_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/acme_cli"]
