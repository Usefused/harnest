# yaml-language-server: $schema=../../../../schemas/config.schema.json
apiVersion: harnest.dev/v1alpha1
kind: Agent
metadata:
  name: helpdesk
  displayName: Helpdesk Assistant
  labels:
    owner: customer-experience
spec:
  enabled: true
  entrypoint: agent:root_agent
  framework:
    name: adk
    mode: managed
  runtime:
    version: "3.12"
    dependencyFile: pyproject.toml
  resources:
    cpu: "1"
    memory: 1Gi
    ephemeralStorage: 1Gi
    timeoutSeconds: 300
    maxConcurrentRequests: 20
  scaling:
    minReplicas: 0
    maxReplicas: 5
  environment:
    LOG_LEVEL: INFO
    OPENAI_MODEL: your-model
    OPENAI_BASE_URL: https://models.example.invalid/v1
    KNOWLEDGE_MCP_URL: https://mcp.example.com/support
  secrets:
    - environmentVariable: KNOWLEDGE_MCP_TOKEN
      secretRef: projects/example/secrets/knowledge-mcp-token/latest
  permissions:
    network:
      outbound:
        - models.example.invalid:443
        - mcp.example.com:443
    filesystem:
      readOnly:
        - /app
      readWrite:
        - /tmp
server:
  live: false
  http:
    port: 8080
    maxConcurrentRequests: 8
