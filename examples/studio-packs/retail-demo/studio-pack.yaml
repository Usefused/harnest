apiVersion: harnest.dev/studio-pack/v1
name: retail-demo
version: 1.1.0
title: Retail live test
description: Shared fictional retail tools generated by GPT-5.5 through the live Harnest
  Studio builder.
resources:
- id: retail-agent
  kind: template
  title: Retail agent
  description: GPT-5.5 agent for the fictional retail component test.
  files:
    pyproject.toml: template/pyproject.toml
    config.yaml: template/config.yaml
    agent.py: template/agent.py
    instructions.md: template/instructions.md
    harnest.lock: template/harnest.lock
    lifecycle/storage.py: template/lifecycle/storage.py
    agent-card.yaml: template/agent-card.yaml
- id: pricing
  kind: component
  title: Retail pricing
  description: Quote CABLE and DOCK prices with bulk discounts.
  files:
    tools/quote_price.py: components/quote_price.py
- id: inventory
  kind: component
  title: Stock availability
  description: Check requested quantities against fictional stock.
  files:
    tools/check_stock.py: components/check_stock.py
- id: shipping
  kind: component
  title: Delivery estimate
  description: Quote delivery cost and days to UK or DE.
  files:
    tools/shipping_estimate.py: components/shipping_estimate.py
