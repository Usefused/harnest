<!doctype html><html lang="en"><meta charset="utf-8"><title>Blueprint workspace</title>
<style>body{font:16px system-ui;color:#dcecff;background:#142238;margin:0;padding:40px}h1{color:#76b7ff}p{line-height:1.6}small{color:#b4cce8}</style>
<h1>Your next blueprint starts here.</h1><p>Create or open an agent using the workspace controls.</p><p>In <strong>Appearance</strong>, choose Blueprint blue and Assistant on the left to complete this workspace.</p><small id="connection">Connecting…</small>
<script>
// The host transfers a private channel; cookies and host commands never cross it.
window.addEventListener('message',event=>{
  if(event.source!==parent||event.data?.type!=='studio:init'||!event.ports[0])return;
  const port=event.ports[0];
  port.onmessage=event=>{if(event.data.name==='connection')document.getElementById('connection').textContent=event.data.value.ready?'Connected to Studio':'Disconnected';};
});
</script></html>
