version: 2

project_name: harnest

release:
  github:
    owner: creativeJoe007
    name: harnest
  # Release Please owns the reviewed notes; GoReleaser only adds artifacts.
  mode: keep-existing

before:
  hooks:
    - python3 -c "import pathlib; [item.unlink() for item in pathlib.Path('internal/runtimewheel/assets').glob('*.whl')]"
    - python3 scripts/prepare_uv_assets.py
    - >-
      python3 scripts/build_runtime_wheel.py --version {{ .Version }}
      {{ if .IsSnapshot }}--allow-version-override{{ end }}
      --outdir internal/runtimewheel/assets

builds:
  - id: harnest
    main: ./cmd/harnest
    binary: harnest
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    tags:
      - harnest_release
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: harnest
    ids:
      - harnest
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - licenses/uv-LICENSE-MIT
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}.dev0"

changelog:
  format: "{{ .Message }}"
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
